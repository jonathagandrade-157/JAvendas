<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | JA Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Valores de fábrica (Premium) — só pra não piscar em branco antes do
       JS aplicar o modelo real (mesmos 4 modelos da Home: Fashion/Modern/
       Premium/Minimalist), lido de store_settings.header_template. */
    --bg:#131313; --ink:#E5E2E1; --ink-soft:#D0C5AF; --line:#333333;
    --green:#F2CA50; --rust:#F2CA50; --gold:#F2CA50; --card:#1A1A1A;
    --accent:#F2CA50; --accent-dark:#000000; --on-accent:#241A00;
    --tpl-radius:0px; --tpl-radius-sm:0px;
    --font-body:'Manrope', sans-serif; --font-heading:'Libre Caslon Text', serif;
  }
  *{box-sizing:border-box;}
  .logo-mark{display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; max-width:160px; overflow:hidden;}
  .logo-mark img{height:100%; width:auto; max-width:160px; object-fit:contain; display:block;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  .serif{font-family:var(--font-heading); font-weight:400; letter-spacing:-0.01em;}
  a{color:inherit;}
  input,select{
    width:100%; padding:12px 14px; border-radius:var(--tpl-radius-sm); border:1.5px solid var(--line);
    font-family:var(--font-body); font-size:14px; background:var(--bg); color:var(--ink); outline:none;
    transition:border-color .15s ease;
  }
  input:focus,select:focus{border-color:var(--accent);}
  input::placeholder{color:var(--ink-soft); opacity:.7;}
  label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:8px;}
  .field{margin-bottom:16px;}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  button{cursor:pointer; font-family:inherit;}

  header{background:var(--header-bg,#0B0B0C); padding:0; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
  header .container{max-width:1160px; margin:0 auto; display:flex; align-items:center; gap:24px; padding:16px 20px;}
  header .brand{display:flex; align-items:center; gap:10px; color:var(--header-ink,#fff); font-size:18px; letter-spacing:.1em;}
  header .brand img{height:28px; width:auto;}
  header .main-nav{display:none; align-items:center; gap:26px; flex:1;}
  header .main-nav a{color:var(--header-ink,#e8e8e8); font-family:var(--font-body); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; opacity:.85; transition:opacity .2s ease, color .2s ease;}
  header .main-nav a:hover{opacity:1; color:var(--accent);}
  @media (min-width:800px){ header .main-nav{display:flex;} }
  header .back-link{color:var(--accent); font-family:var(--font-body); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-left:auto; opacity:.9; transition:opacity .2s ease;}
  header .back-link:hover{opacity:1;}

  .container{max-width:1040px; margin:0 auto; padding:0 20px;}
  .layout{display:grid; grid-template-columns:1fr; gap:28px; padding:36px 0 80px;}
  @media (min-width:900px){ .layout{grid-template-columns:1.5fr 1fr;} }

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--tpl-radius); padding:26px; margin-bottom:20px;}
  .card h2{font-family:var(--font-heading); font-weight:400; font-size:18px; margin:0 0 20px; display:flex; align-items:center; gap:10px; color:var(--ink);}
  .step-num{
    width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--on-accent);
    font-family:var(--font-body); font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  /* Skin por modelo nos mesmos cards/steps — sem tocar no fluxo de compra */
  [data-store-model="classic"] .card h2, [data-store-model="ecommerce"] .card h2{
    font-family:var(--font-body); font-weight:800; font-size:14px; text-transform:uppercase; letter-spacing:.04em;
  }
  [data-store-model="classic"] .step-num, [data-store-model="ecommerce"] .step-num{border-radius:var(--tpl-radius-sm);}
  [data-store-model="minimal"] .card h2{
    font-family:var(--font-body); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.08em;
  }
  [data-store-model="minimal"] .step-num{background:transparent; border:1.5px solid var(--ink); color:var(--ink); border-radius:0;}
  [data-store-model="premium"] .card h2{letter-spacing:.02em;}

  .cart-line{display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .cart-line:last-child{border-bottom:none;}
  .cart-line img{width:60px; height:60px; object-fit:cover; background:color-mix(in srgb, var(--card) 60%, var(--bg) 40%); flex-shrink:0;}
  .cart-line .name{font-size:13.5px; font-weight:600; margin:0 0 2px; color:var(--ink);}
  .cart-line .meta{font-size:12px; color:var(--ink-soft); margin:0;}
  .qty-controls{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .qty-btn{width:24px; height:24px; border:1px solid var(--line); background:none; color:var(--ink); border-radius:var(--tpl-radius-sm); font-size:13px; line-height:1; transition:border-color .15s ease;}
  .qty-btn:hover{border-color:var(--accent);}
  .remove-btn{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); background:none; border:none; text-decoration:underline; margin-left:auto; transition:color .15s ease;}
  .remove-btn:hover{color:var(--accent);}
  .line-total{font-size:13.5px; font-weight:700; color:var(--ink); white-space:nowrap;}

  .shipping-opt{
    display:flex; align-items:center; gap:10px; padding:14px; border:1.5px solid var(--line); border-radius:var(--tpl-radius-sm); color:var(--ink);
    margin-bottom:8px; cursor:pointer; font-size:13.5px; transition:border-color .15s ease;
  }
  .shipping-opt:hover{border-color:color-mix(in srgb, var(--accent) 50%, var(--line));}
  .shipping-opt.selected{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent);}
  .shipping-opt .price{margin-left:auto; font-weight:700;}

  .coupon-row{display:flex; gap:8px;}
  .coupon-row input{flex:1;}
  .coupon-row button{padding:0 20px; border:1.5px solid var(--accent); border-radius:var(--tpl-radius-sm); background:transparent; color:var(--accent); font-family:var(--font-body); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; transition:background .2s ease, color .2s ease;}
  .coupon-row button:hover{background:var(--accent); color:var(--on-accent);}
  #couponMsg{font-size:12.5px; margin-top:8px;}

  .summary-row{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:10px; color:var(--ink-soft);}
  .summary-row.total{color:var(--ink); font-family:var(--font-heading); font-weight:400; font-size:22px; border-top:1px solid var(--line); padding-top:16px; margin-top:10px;}

  .pay-methods{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .pay-pill{
    flex:1; min-width:100px; text-align:center; padding:14px 8px; border:1.5px solid var(--line); border-radius:var(--tpl-radius-sm);
    font-family:var(--font-body); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); cursor:pointer; background:transparent; transition:all .15s ease;
  }
  .pay-pill:hover{border-color:color-mix(in srgb, var(--accent) 50%, var(--line));}
  .pay-pill.selected{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, transparent); color:var(--accent);}
  .pay-note{font-size:12px; color:var(--ink-soft); line-height:1.5; margin-top:-10px; margin-bottom:18px;}

  .pay-btn{
    width:100%; padding:16px; border:none; border-radius:var(--tpl-radius-sm); background:var(--accent); color:var(--on-accent);
    font-family:var(--font-body); font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; transition:filter .2s ease;
  }
  .pay-btn:hover:not(:disabled){filter:brightness(1.08);}
  .pay-btn:disabled{opacity:.5; cursor:not-allowed;}
  #formError{color:#E2695C; font-size:13px; margin-top:10px; display:none;}

  .status-screen{max-width:520px; margin:100px auto; text-align:center; padding:0 20px;}
  .status-icon{width:68px; height:68px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 24px;}
  .status-screen h1{font-family:var(--font-heading); font-weight:400; font-size:26px; margin:0 0 12px; color:var(--ink);}
  .status-screen p{color:var(--ink-soft); font-size:15px; line-height:1.65;}
  .status-screen a{display:inline-block; margin-top:26px; padding:13px 28px; background:var(--accent); color:var(--on-accent); font-family:var(--font-body); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; text-decoration:none;}

  .empty-cart{text-align:center; padding:80px 20px; color:var(--ink-soft);}
  .empty-cart svg{margin-bottom:16px; opacity:.6;}
  .empty-cart a{display:inline-block; margin-top:16px; font-weight:700; color:var(--accent); text-decoration:underline;}
</style>
</head>
<body>

<header>
  <div class="container">
    <span class="brand serif">
      <span id="logoImgCheckout" class="logo-mark" style="width:28px;height:28px;">
        <svg width="28" height="28" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#fff"/><text x="20" y="27" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="17" fill="#111">JA</text></svg>
      </span>
      JA STORE
    </span>
    <nav class="main-nav">
      <a href="index.html#topo">Início</a>
      <a href="index.html#produtos">Produtos</a>
      <a href="index.html#categoriasDestaqueSection">Categorias</a>
      <a href="index.html#produtos">Ofertas</a>
      <a href="index.html#sobre">Sobre nós</a>
      <a href="index.html#contato">Contato</a>
    </nav>
    <a href="index.html" class="back-link">← Voltar à loja</a>
  </div>
</header>

<div id="app"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/tracking.js"></script>
<script>
(function(){
  const app = document.getElementById('app');
  const urlParams = new URLSearchParams(window.location.search);
  const status = urlParams.get('status');

  window.JATracking.init();

  // ---------- Se voltou do Mercado Pago, mostra a tela de status ----------
  if (status){
    renderStatusScreen(status);
    return;
  }

  const cart = JSON.parse(localStorage.getItem('ja_cart') || '[]');
  if (!cart.length){
    app.innerHTML = `<div class="container"><div class="empty-cart"><svg width="56" height="56" viewBox="0 0 24 24" fill="none"><path d="M6 2L4 6M18 2l2 4M3 8h18l-1.5 12a2 2 0 01-2 1.8H6.5a2 2 0 01-2-1.8L3 8z" stroke="var(--line)" stroke-width="1.6"/></svg><p>Sua sacola está vazia.</p><a href="index.html">Voltar à loja</a></div></div>`;
    return;
  }

  let shippingOptions = [];
  let selectedShipping = null;
  let selectedPaymentMethod = null;
  let coupon = { code: null, discount: 0, freeShipping: false };

  // ---------- fonte única de verdade: valores vêm do banco (Configurações no admin) ----------
  // Esses valores abaixo são só um "padrão de segurança" caso a busca no
  // banco falhe — assim que loadStoreConfig() rodar, eles são substituídos
  // pelos valores reais configurados no admin.
  let PIX_DISCOUNT_RATE = 0.05;
  let FREE_SHIPPING_THRESHOLD = 300;
  let MOTOBOY_FREE_SHIPPING = false;
  let MELHOR_ENVIO_ENABLED = true;

  // Mesmos 4 modelos completos da Home (index.html) — replicados aqui
  // porque esta é uma página HTML separada, sem módulo JS compartilhado.
  // Só os tokens de cor/tipografia/formato; a lógica de pagamento/frete/
  // pedido abaixo continua exatamente a mesma nos 4.
  const TEMPLATE_DESIGN_TOKENS = {
    classic: { bg:'#131313', card:'#1E1E1E', ink:'#F5F3F2', inkSoft:'#8E8E93', line:'#2A2A2A', accent:'#FF5168', radius:'4px', radiusSm:'2px', fontHeading:"'Montserrat', sans-serif", fontHeadingImport:'Montserrat:wght@700;800', fontBody:"'Be Vietnam Pro', sans-serif", fontBodyImport:'Be+Vietnam+Pro:wght@400;500;700' },
    premium: { bg:'#131313', card:'#1A1A1A', ink:'#E5E2E1', inkSoft:'#D0C5AF', line:'#333333', accent:'#F2CA50', radius:'0px', radiusSm:'0px', fontHeading:"'Libre Caslon Text', serif", fontHeadingImport:'Libre+Caslon+Text', fontBody:"'Manrope', sans-serif", fontBodyImport:'Manrope:wght@400;500;600' },
    ecommerce: { bg:'#F8FAFC', card:'#FFFFFF', ink:'#191C1E', inkSoft:'#464554', line:'#E2E8F0', accent:'#4648D4', radius:'16px', radiusSm:'8px', fontHeading:"'Hanken Grotesk', sans-serif", fontHeadingImport:'Hanken+Grotesk:wght@700;800', fontBody:"'Plus Jakarta Sans', sans-serif", fontBodyImport:'Plus+Jakarta+Sans:wght@400;500;600' },
    minimal: { bg:'#F9F9F9', card:'#FFFFFF', ink:'#1A1C1C', inkSoft:'#757575', line:'#F0F0F0', accent:'#111111', radius:'0px', radiusSm:'0px', fontHeading:"'Manrope', sans-serif", fontHeadingImport:'Manrope:wght@600;700', fontBody:"'Inter', sans-serif", fontBodyImport:'Inter:wght@400;500' },
  };
  const loadedGoogleFonts = new Set();
  function ensureGoogleFontLoaded(importName){
    if (!importName || loadedGoogleFonts.has(importName)) return;
    loadedGoogleFonts.add(importName);
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `https://fonts.googleapis.com/css2?family=${importName}&display=swap`;
    document.head.appendChild(link);
  }
  function hexLuminance(hex){
    const h = (hex||'#000000').replace('#','');
    const r = parseInt(h.substr(0,2),16)||0, g = parseInt(h.substr(2,2),16)||0, b = parseInt(h.substr(4,2),16)||0;
    return 0.299*r + 0.587*g + 0.114*b;
  }
  function applyStoreModel(key){
    const tokens = TEMPLATE_DESIGN_TOKENS[key] || TEMPLATE_DESIGN_TOKENS.premium;
    const root = document.documentElement.style;
    root.setProperty('--bg', tokens.bg);
    root.setProperty('--card', tokens.card);
    root.setProperty('--ink', tokens.ink);
    root.setProperty('--ink-soft', tokens.inkSoft);
    root.setProperty('--line', tokens.line);
    root.setProperty('--accent', tokens.accent);
    root.setProperty('--rust', tokens.accent);
    root.setProperty('--on-accent', hexLuminance(tokens.accent) > 150 ? '#241A00' : '#FFFFFF');
    root.setProperty('--tpl-radius', tokens.radius);
    root.setProperty('--tpl-radius-sm', tokens.radiusSm);
    root.setProperty('--font-heading', tokens.fontHeading);
    root.setProperty('--font-body', tokens.fontBody);
    const headerIsDark = hexLuminance(tokens.bg) < 128;
    root.setProperty('--header-bg', headerIsDark ? '#0B0B0C' : tokens.card);
    root.setProperty('--header-ink', headerIsDark ? '#FFFFFF' : tokens.ink);
    document.documentElement.setAttribute('data-store-model', TEMPLATE_DESIGN_TOKENS[key] ? key : 'premium');
    ensureGoogleFontLoaded(tokens.fontHeadingImport);
    ensureGoogleFontLoaded(tokens.fontBodyImport);
  }

  async function loadStoreConfig(){
    try {
      const sb = window.getSupabaseClient();
      const { data, error } = await sb
        .from('store_settings')
        .select('free_shipping_threshold, pix_discount_percent, motoboy_free_shipping, logo_url, header_template, payment_pix_enabled, payment_card_enabled, payment_boleto_enabled, melhor_envio_enabled')
        .eq('id', 1)
        .maybeSingle();
      if (error) throw error;
      applyStoreModel(data && data.header_template);
      if (data){
        if (data.free_shipping_threshold != null) FREE_SHIPPING_THRESHOLD = Number(data.free_shipping_threshold);
        if (data.pix_discount_percent != null) PIX_DISCOUNT_RATE = Number(data.pix_discount_percent) / 100;
        MOTOBOY_FREE_SHIPPING = !!data.motoboy_free_shipping;
        MELHOR_ENVIO_ENABLED = data.melhor_envio_enabled !== false;

        // Esconde de verdade (não só visualmente) as formas de pagamento
        // desativadas no admin — se o cliente tentar escolher uma
        // desativada, ela simplesmente não existe na tela.
        if (data.payment_pix_enabled === false){
          const el = document.querySelector('[data-method="pix"]');
          if (el) el.remove();
        }
        if (data.payment_card_enabled === false){
          const el = document.querySelector('[data-method="credit_card"]');
          if (el) el.remove();
        }
        if (data.payment_boleto_enabled === false){
          const el = document.querySelector('[data-method="boleto"]');
          if (el) el.remove();
        }

        if (data.logo_url){
          const logoEl = document.getElementById('logoImgCheckout');
          if (logoEl) logoEl.innerHTML = `<img src="${data.logo_url}" alt="JA Store" onerror="this.parentElement.innerHTML='<svg width=&quot;100%&quot; height=&quot;100%&quot; viewBox=&quot;0 0 40 40&quot;><rect width=&quot;40&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;%23fff&quot;/><text x=&quot;20&quot; y=&quot;27&quot; text-anchor=&quot;middle&quot; font-family=&quot;Inter,sans-serif&quot; font-weight=&quot;800&quot; font-size=&quot;17&quot; fill=&quot;%23111&quot;>JA</text></svg>';">`;
        }
      }
    } catch (err) {
      console.error('Não foi possível carregar configurações da loja — usando padrões.', err);
      applyStoreModel(null);
    }
  }

  function formatBRL(v){ return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

  function subtotal(){
    return cart.reduce((s,i)=> s + (i.price * i.qty), 0);
  }
  function pixDiscountValue(){
    if (selectedPaymentMethod !== 'pix') return 0;
    return Math.round(subtotal() * PIX_DISCOUNT_RATE * 100) / 100;
  }
  function total(){
    const shippingPrice = coupon.freeShipping ? 0 : (selectedShipping ? selectedShipping.price : 0);
    return Math.max(0, subtotal() - coupon.discount - pixDiscountValue() + shippingPrice);
  }

  function render(){
    app.innerHTML = `
      <div class="container layout">
        <div>
          <div class="card">
            <h2><span class="step-num">1</span> Sua sacola</h2>
            <div id="cartLines"></div>
          </div>

          <div class="card">
            <h2><span class="step-num">2</span> Seus dados</h2>
            <div class="row-2">
              <div class="field"><label>Nome completo</label><input id="custName" type="text" required></div>
              <div class="field"><label>CPF (opcional)</label><input id="custCpf" type="text" placeholder="000.000.000-00"></div>
            </div>
            <div class="row-2">
              <div class="field"><label>E-mail</label><input id="custEmail" type="email" required></div>
              <div class="field"><label>WhatsApp</label><input id="custPhone" type="tel" placeholder="(11) 90000-0000" required></div>
            </div>
          </div>

          <div class="card">
            <h2><span class="step-num">3</span> Endereço de entrega</h2>
            <div class="row-2">
              <div class="field"><label>CEP</label><input id="cep" type="text" placeholder="00000-000" required></div>
              <div class="field"><label>Cidade</label><input id="city" type="text" required></div>
            </div>
            <div class="row-2">
              <div class="field"><label>Rua</label><input id="street" type="text" required></div>
              <div class="field"><label>Número</label><input id="number" type="text" required></div>
            </div>
            <div class="row-2">
              <div class="field"><label>Bairro</label><input id="neighborhood" type="text" required></div>
              <div class="field"><label>Estado (UF)</label><input id="state" type="text" maxlength="2" required></div>
            </div>
            <div class="field"><label>Complemento (opcional)</label><input id="complement" type="text"></div>

            <div id="shippingOptions"></div>
            <p id="shippingMsg" style="font-size:12.5px;color:var(--ink-soft);"></p>
          </div>

          <div class="card">
            <h2><span class="step-num">4</span> Cupom de desconto</h2>
            <div class="coupon-row">
              <input id="couponInput" type="text" placeholder="Código do cupom">
              <button id="applyCouponBtn">Aplicar</button>
            </div>
            <p id="couponMsg"></p>
          </div>
        </div>

        <div>
          <div class="card" style="position:sticky; top:20px;">
            <h2>Resumo do pedido</h2>
            <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal"></span></div>
            <div class="summary-row"><span>Desconto (cupom)</span><span id="sumDiscount">R$ 0,00</span></div>
            <div class="summary-row" id="sumPixRow" style="display:none;"><span>Desconto Pix (5%)</span><span id="sumPixDiscount"></span></div>
            <div class="summary-row"><span>Frete</span><span id="sumShipping">Calcule o CEP</span></div>
            <div class="summary-row total"><span>Total</span><span id="sumTotal"></span></div>

            <div class="pay-methods" id="payMethods" style="margin-top:18px;">
              <div class="pay-pill" data-method="credit_card">💳 Cartão</div>
              <div class="pay-pill" data-method="pix">Pix <span style="color:var(--rust); font-weight:800;">-5%</span></div>
              <div class="pay-pill" data-method="boleto">Boleto</div>
            </div>
            <p class="pay-note">Escolha a forma de pagamento — você conclui com segurança na página do Mercado Pago.</p>

            <button class="pay-btn" id="payBtn">Escolha uma forma de pagamento</button>
            <p id="formError"></p>
          </div>
        </div>
      </div>
    `;

    renderCartLines();
    updateSummary();
    bindEvents();
  }

  function renderCartLines(){
    document.getElementById('cartLines').innerHTML = cart.map((item, idx) => `
      <div class="cart-line" data-idx="${idx}">
        <img src="${item.image || ''}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div style="flex:1">
          <p class="name">${item.name}</p>
          <p class="meta">${item.size ? `Tam ${item.size} · ` : ''}${formatBRL(item.price)}</p>
          <div class="qty-controls">
            <button class="qty-btn" data-action="dec" data-idx="${idx}">−</button>
            <span style="font-size:13px;width:16px;text-align:center">${item.qty}</span>
            <button class="qty-btn" data-action="inc" data-idx="${idx}">+</button>
            <button class="remove-btn" data-idx="${idx}">remover</button>
          </div>
        </div>
        <span class="line-total">${formatBRL(item.price * item.qty)}</span>
      </div>
    `).join('');

    document.querySelectorAll('.qty-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = Number(btn.dataset.idx);
        cart[idx].qty += btn.dataset.action === 'inc' ? 1 : -1;
        if (cart[idx].qty <= 0) cart.splice(idx,1);
        if (cart.length === 0){
          localStorage.removeItem('ja_cart');
          app.innerHTML = `<div class="container"><div class="empty-cart"><svg width="56" height="56" viewBox="0 0 24 24" fill="none"><path d="M6 2L4 6M18 2l2 4M3 8h18l-1.5 12a2 2 0 01-2 1.8H6.5a2 2 0 01-2-1.8L3 8z" stroke="var(--line)" stroke-width="1.6"/></svg><p>Sua sacola está vazia.</p><a href="index.html">Voltar à loja</a></div></div>`;
          return;
        }
        localStorage.setItem('ja_cart', JSON.stringify(cart));
        renderCartLines();
        updateSummary();
      });
    });
    document.querySelectorAll('.remove-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = Number(btn.dataset.idx);
        cart.splice(idx,1);
        localStorage.setItem('ja_cart', JSON.stringify(cart));
        if (cart.length === 0){
          app.innerHTML = `<div class="container"><div class="empty-cart"><svg width="56" height="56" viewBox="0 0 24 24" fill="none"><path d="M6 2L4 6M18 2l2 4M3 8h18l-1.5 12a2 2 0 01-2 1.8H6.5a2 2 0 01-2-1.8L3 8z" stroke="var(--line)" stroke-width="1.6"/></svg><p>Sua sacola está vazia.</p><a href="index.html">Voltar à loja</a></div></div>`;
          return;
        }
        renderCartLines();
        updateSummary();
      });
    });
  }

  function updateSummary(){
    document.getElementById('sumSubtotal').textContent = formatBRL(subtotal());
    document.getElementById('sumDiscount').textContent = '- ' + formatBRL(coupon.discount);
    const pixDiscount = pixDiscountValue();
    document.getElementById('sumPixRow').style.display = pixDiscount > 0 ? 'flex' : 'none';
    if (pixDiscount > 0) document.getElementById('sumPixDiscount').textContent = '- ' + formatBRL(pixDiscount);
    document.getElementById('sumShipping').textContent = coupon.freeShipping
      ? 'Grátis (cupom)'
      : (selectedShipping ? (selectedShipping.price === 0 ? 'Grátis' : formatBRL(selectedShipping.price)) : 'Calcule o CEP');
    document.getElementById('sumTotal').textContent = formatBRL(total());
  }

  function bindEvents(){
    // Busca endereço automaticamente pelo CEP (ViaCEP — gratuito, sem chave)
    document.getElementById('cep').addEventListener('blur', async (e)=>{
      const cep = e.target.value.replace(/\D/g,'');
      if (cep.length !== 8) return;
      try {
        const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const data = await res.json();
        if (!data.erro){
          document.getElementById('street').value = data.logradouro || '';
          document.getElementById('neighborhood').value = data.bairro || '';
          document.getElementById('city').value = data.localidade || '';
          document.getElementById('state').value = data.uf || '';
        }
      } catch(err){ console.error('Erro ao buscar CEP', err); }

      await calculateShipping(cep);
    });

    document.getElementById('applyCouponBtn').addEventListener('click', applyCoupon);
    document.getElementById('payBtn').addEventListener('click', goToPayment);

    const methodLabels = {
      credit_card: 'Finalizar pedido no Cartão',
      pix: 'Finalizar pedido no Pix',
      boleto: 'Finalizar pedido no Boleto',
    };
    document.querySelectorAll('.pay-pill').forEach(pill=>{
      pill.addEventListener('click', ()=>{
        document.querySelectorAll('.pay-pill').forEach(p=>p.classList.remove('selected'));
        pill.classList.add('selected');
        selectedPaymentMethod = pill.dataset.method;
        document.getElementById('payBtn').textContent = methodLabels[selectedPaymentMethod];
        updateSummary();
      });
    });
  }

  async function calculateShipping(cep){
    const msgEl = document.getElementById('shippingMsg');
    const optsEl = document.getElementById('shippingOptions');
    msgEl.textContent = 'Calculando frete...';
    optsEl.innerHTML = '';
    try {
      const correiosPromise = MELHOR_ENVIO_ENABLED
        ? fetch('/.netlify/functions/shipping-quote', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ cepDestino: cep, items: cart.map(i=>({quantity:i.qty})) })
          }).then(r=>r.json())
        : Promise.resolve({ options: [] });

      // Monta o endereço (sem o número, que o cliente ainda não digitou
      // nesse momento) só pra estimar a região — suficiente pra calcular
      // a distância até a loja.
      const addressForMotoboy = [
        document.getElementById('street').value,
        document.getElementById('neighborhood').value,
        document.getElementById('city').value,
        document.getElementById('state').value,
        cep,
      ].filter(Boolean).join(', ');

      const motoboyPromise = fetch('/.netlify/functions/motoboy-quote', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ address: addressForMotoboy })
      }).then(r=>r.json()).catch(()=> ({ available:false }));

      const [data, motoboyData] = await Promise.all([correiosPromise, motoboyPromise]);

      if (!data.options || data.options.length === 0){
        msgEl.textContent = data.error || 'Não foi possível calcular o frete. Tente novamente.';
        return;
      }

      let options = [...data.options];
      let motoboyNote = '';

      if (motoboyData.available){
        options.push({
          service: '🛵 Entrega por Motoboy',
          price: motoboyData.price,
          days: 0,
          etaText: motoboyData.etaText,
          isMotoboy: true,
        });
      } else if (motoboyData.reason === 'out_of_range'){
        motoboyNote = motoboyData.message || 'Entrega por motoboy indisponível para este endereço.';
      }

      const freeShipping = subtotal() >= FREE_SHIPPING_THRESHOLD;
      // Regra específica do Motoboy: só entra no frete grátis geral se
      // a opção "Frete grátis para Motoboy" estiver ativada nas configurações.
      shippingOptions = options.map(opt => {
        const appliesFree = freeShipping && (!opt.isMotoboy || MOTOBOY_FREE_SHIPPING);
        return appliesFree ? { ...opt, price: 0 } : opt;
      });

      msgEl.textContent = freeShipping
        ? `🎉 Frete grátis! Sua compra passou de ${formatBRL(FREE_SHIPPING_THRESHOLD)}.${!MOTOBOY_FREE_SHIPPING ? ' (Motoboy não incluso na promoção.)' : ''}`
        : motoboyNote;
      optsEl.innerHTML = shippingOptions.map((opt, i) => `
        <div class="shipping-opt" data-idx="${i}">
          <span>${opt.service}${opt.etaText ? ` — ${opt.etaText}` : ` — até ${opt.days} dia(s)`}</span>
          <span class="price">${opt.price === 0 ? 'Grátis' : formatBRL(opt.price)}</span>
        </div>
      `).join('');
      optsEl.querySelectorAll('.shipping-opt').forEach(el=>{
        el.addEventListener('click', ()=>{
          optsEl.querySelectorAll('.shipping-opt').forEach(o=>o.classList.remove('selected'));
          el.classList.add('selected');
          selectedShipping = shippingOptions[Number(el.dataset.idx)];
          updateSummary();
        });
      });
      // seleciona a opção mais barata automaticamente
      optsEl.querySelector('.shipping-opt')?.click();
    } catch(err){
      console.error(err);
      msgEl.textContent = 'Erro ao calcular frete. Verifique sua conexão.';
    }
  }

  async function applyCoupon(){
    const code = document.getElementById('couponInput').value.trim();
    const msgEl = document.getElementById('couponMsg');
    if (!code) return;
    msgEl.style.color = 'var(--ink-soft)';
    msgEl.textContent = 'Verificando...';
    try {
      const emailField = document.getElementById('custEmail');
      const res = await fetch('/.netlify/functions/apply-coupon', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          code,
          subtotal: subtotal(),
          items: cart.map(i => ({ id: i.id, price: i.price, qty: i.qty })),
          customerEmail: emailField && emailField.value.trim() ? emailField.value.trim() : undefined,
        })
      });
      const data = await res.json();
      if (!data.valid){
        coupon = { code: null, discount: 0, freeShipping: false };
        msgEl.style.color = 'var(--rust)';
        msgEl.textContent = data.message || 'Cupom inválido.';
      } else {
        coupon = { code: data.code, discount: data.discount || 0, freeShipping: !!data.freeShipping };
        msgEl.style.color = 'var(--green)';
        msgEl.textContent = data.message;
      }
      updateSummary();
    } catch(err){
      console.error(err);
      msgEl.style.color = 'var(--rust)';
      msgEl.textContent = 'Erro ao validar cupom.';
    }
  }

  async function goToPayment(){
    const errEl = document.getElementById('formError');
    errEl.style.display = 'none';

    const customer = {
      name: document.getElementById('custName').value.trim(),
      cpf: document.getElementById('custCpf').value.trim(),
      email: document.getElementById('custEmail').value.trim(),
      phone: document.getElementById('custPhone').value.trim(),
    };
    const address = {
      cep: document.getElementById('cep').value.trim(),
      street: document.getElementById('street').value.trim(),
      number: document.getElementById('number').value.trim(),
      complement: document.getElementById('complement').value.trim(),
      neighborhood: document.getElementById('neighborhood').value.trim(),
      city: document.getElementById('city').value.trim(),
      state: document.getElementById('state').value.trim(),
    };

    if (!customer.name || !customer.email || !customer.phone){
      showFormError('Preencha nome, e-mail e WhatsApp.'); return;
    }
    if (!address.cep || !address.street || !address.number || !address.city || !address.state){
      showFormError('Preencha o endereço completo.'); return;
    }
    if (!selectedShipping){
      showFormError('Calcule e selecione uma opção de frete.'); return;
    }
    if (!selectedPaymentMethod){
      showFormError('Escolha uma forma de pagamento (Cartão, Pix ou Boleto).'); return;
    }

    const payBtn = document.getElementById('payBtn');
    payBtn.disabled = true;
    payBtn.textContent = 'Preparando pagamento...';

    try {
      const res = await fetch('/.netlify/functions/create-payment', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          customer, address,
          preferredMethod: selectedPaymentMethod,
          items: cart.map(i => ({ id: i.id, quantity: i.qty, size: i.size })),
          shipping: selectedShipping,
          couponCode: coupon.code,
        })
      });
      const data = await res.json();
      if (!res.ok){
        showFormError(data.error || 'Não foi possível iniciar o pagamento.');
        payBtn.disabled = false;
        payBtn.textContent = selectedPaymentMethod ? {credit_card:'Finalizar pedido no Cartão',pix:'Finalizar pedido no Pix',boleto:'Finalizar pedido no Boleto'}[selectedPaymentMethod] : 'Escolha uma forma de pagamento';
        return;
      }
      localStorage.removeItem('ja_cart');
      // Guarda os dados desse pedido pra disparar o evento de "compra
      // concluída" quando o cliente voltar pra tela de sucesso — sem
      // precisar reconsultar o pedido no banco (o carrinho já tinha
      // tudo que precisamos pra isso).
      sessionStorage.setItem('ja_purchase_pending', JSON.stringify({
        orderId: data.orderId,
        total: total(),
        items: cart.map(i => ({ id:i.id, name:i.name, price:i.price, qty:i.qty })),
      }));
      window.location.href = data.initPoint;
    } catch(err){
      console.error(err);
      showFormError('Erro de conexão. Tente novamente.');
      payBtn.disabled = false;
      payBtn.textContent = selectedPaymentMethod ? {credit_card:'Finalizar pedido no Cartão',pix:'Finalizar pedido no Pix',boleto:'Finalizar pedido no Boleto'}[selectedPaymentMethod] : 'Escolha uma forma de pagamento';
    }
  }

  function showFormError(msg){
    const errEl = document.getElementById('formError');
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }

  function renderStatusScreen(status){
    const config = {
      success: { color:'#34493A', title:'Pagamento aprovado! 🎉', text:'Recebemos seu pedido e já vamos preparar o envio. Você vai receber a confirmação por e-mail e WhatsApp.' },
      pending: { color:'#C79A3C', title:'Pagamento em análise', text:'Assim que for aprovado (geralmente até 2 dias úteis para boleto), você recebe a confirmação por e-mail e WhatsApp.' },
      failure: { color:'#8B3A2B', title:'Pagamento não aprovado', text:'Algo deu errado com o pagamento. Você pode voltar à loja e tentar novamente.' },
    }[status] || { color:'#5B564C', title:'Status do pedido', text:'' };

    app.innerHTML = `
      <div class="status-screen">
        <div class="status-icon" style="background:${config.color}22">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="${config.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1 class="serif">${config.title}</h1>
        <p>${config.text}</p>
        <a href="index.html">Voltar à loja</a>
      </div>
    `;

    // Dispara o evento de "compra concluída" só na tela de sucesso, e só
    // uma vez (limpa o dado salvo depois, pra não contar de novo se a
    // pessoa atualizar a página).
    if (status === 'success'){
      try {
        const pending = JSON.parse(sessionStorage.getItem('ja_purchase_pending') || 'null');
        const orderIdFromUrl = urlParams.get('order');
        if (pending && (!orderIdFromUrl || pending.orderId === orderIdFromUrl)){
          window.JATracking.trackPurchase(pending.orderId, pending.items, pending.total);
          sessionStorage.removeItem('ja_purchase_pending');
        }
      } catch (err) {
        console.error('Erro ao registrar evento de compra:', err);
      }
    }
  }

  render();
  loadStoreConfig().then(()=> updateSummary());
  window.JATracking.trackBeginCheckout(
    cart.map(i => ({ id:i.id, name:i.name, price:i.price, qty:i.qty })),
    subtotal()
  );
})();
</script>

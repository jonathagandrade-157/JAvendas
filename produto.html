<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Produto | JA Store</title>
<meta id="pageDescription" name="description" content="Confira esse produto na JA Store.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Valores de fábrica (Premium) — só pra não piscar em branco antes do
       JS aplicar o modelo real (mesmos 4 modelos da Home: Fashion/Modern/
       Premium/Minimalist), lido de store_settings.header_template. */
    --bg:#131313; --ink:#E5E2E1; --ink-soft:#D0C5AF; --line:#333333;
    --card:#1A1A1A; --accent:#F2CA50; --accent-dark:#000000; --rust:#F2CA50; --green:#4CAF7D;
    --on-accent:#241A00; --tpl-radius:0px; --tpl-radius-sm:0px; --tpl-shadow:none;
    --font-body:'Manrope', sans-serif; --font-heading:'Libre Caslon Text', serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;}
  .serif{font-family:var(--font-heading); font-weight:400; letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}
  button{cursor:pointer; font-family:inherit;}
  .container{width:100%; max-width:1160px; margin:0 auto; padding:0 20px;}
  .logo-mark{display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; max-width:140px; overflow:hidden;}
  .logo-mark img{height:100%; width:auto; max-width:140px; object-fit:contain; display:block;}

  header{background:var(--header-bg,#0B0B0C); padding:0; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
  header .container{max-width:1160px; margin:0 auto; display:flex; align-items:center; gap:16px; padding:16px 20px;}
  header .brand{display:flex; align-items:center; gap:10px; color:var(--header-ink,#fff); font-size:18px; letter-spacing:.1em;}
  header .icon-btn{width:36px; height:36px; border-radius:50%; border:none; background:var(--header-icon-bg,rgba(255,255,255,0.12)); color:var(--header-ink,#fff); display:flex; align-items:center; justify-content:center; position:relative; transition:background .2s ease;}
  header .icon-btn:hover{background:rgba(255,255,255,0.22);}
  header .right{margin-left:auto; display:flex; align-items:center; gap:14px;}
  header .back-link{color:var(--accent); font-family:var(--font-body); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; opacity:.9; transition:opacity .2s ease;}
  header .back-link:hover{opacity:1;}
  .cart-count{position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%; background:var(--accent); color:var(--on-accent); font-size:9.5px; display:flex; align-items:center; justify-content:center;}

  .breadcrumb{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:20px 20px 0; max-width:1160px; margin:0 auto;}
  .breadcrumb a:hover{color:var(--accent);}

  .product-layout{display:grid; grid-template-columns:1fr; gap:40px; padding:24px 20px 60px; max-width:1160px; margin:0 auto;}
  @media (min-width:900px){ .product-layout{grid-template-columns:1.1fr 1fr;} }

  .gallery-main{
    width:100%; aspect-ratio:1/1; overflow:hidden; border:1px solid var(--line); border-radius:var(--tpl-radius);
    display:flex; align-items:center; justify-content:center; background:var(--card); cursor:zoom-in;
  }
  .gallery-main img{width:100%; height:100%; object-fit:cover; transition:transform .4s ease;}
  .gallery-main:hover img{transform:scale(1.06);}
  .gallery-thumbs{display:flex; gap:8px; margin-top:12px; overflow-x:auto;}
  .gallery-thumb{width:66px; height:66px; flex-shrink:0; overflow:hidden; border:2px solid transparent; border-radius:var(--tpl-radius-sm); opacity:.6; cursor:pointer; transition:opacity .2s ease, border-color .2s ease;}
  .gallery-thumb.active{border-color:var(--accent); opacity:1;}
  .gallery-thumb img{width:100%; height:100%; object-fit:cover;}

  .product-info .eyebrow{font-family:var(--font-body); font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin:0 0 10px;}
  .product-info h1{font-family:var(--font-heading); font-weight:400; font-size:28px; line-height:1.2; margin:0 0 16px; color:var(--ink);}
  .rating-summary{display:flex; align-items:center; gap:8px; margin:0 0 12px; color:var(--accent); font-size:13px; letter-spacing:1px;}
  .rating-summary .rs-count{color:var(--ink-soft); font-size:12px; letter-spacing:normal;}
  [data-store-model="minimal"] .rating-summary{display:none;}
  .price-row{display:flex; align-items:baseline; gap:12px; margin-bottom:8px;}
  .price-old{font-size:15px; color:var(--ink-soft); text-decoration:line-through;}
  .price-now{font-family:var(--font-heading); font-size:28px; font-weight:400; color:var(--ink);}
  .price-now.on-sale{color:var(--accent);}
  .price-badge{display:none; font-size:11px; font-weight:800; text-transform:uppercase; padding:3px 8px; border-radius:var(--tpl-radius-sm); background:var(--rust); color:#fff;}
  [data-store-model="classic"] .price-badge, [data-store-model="ecommerce"] .price-badge{display:inline-block;}
  .price-notes{font-size:12.5px; color:var(--ink-soft); margin:0 0 24px; line-height:1.6;}
  .price-notes b{color:var(--accent);}

  .stock-badge{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:20px;}
  .stock-dot{width:7px; height:7px; border-radius:50%;}

  .opt-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:10px; display:block;}
  .size-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px;}
  .size-btn{min-width:44px; height:44px; padding:0 12px; border:1.5px solid var(--line); border-radius:var(--tpl-radius-sm); background:transparent; color:var(--ink); font-family:var(--font-body); font-size:13px; font-weight:600; transition:all .15s ease;}
  .size-btn:hover{border-color:var(--accent);}
  .size-btn.active{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}

  .qty-row{display:flex; align-items:center; gap:12px; margin-bottom:26px;}
  .qty-btn{width:36px; height:36px; border:1.5px solid var(--line); border-radius:var(--tpl-radius-sm); background:transparent; color:var(--ink); font-size:16px; transition:border-color .15s ease;}
  .qty-btn:hover{border-color:var(--accent);}
  .qty-value{font-size:15px; font-weight:700; color:var(--ink); width:24px; text-align:center;}

  .action-row{display:flex; flex-direction:column; gap:10px; margin-bottom:28px;}
  /* Modern/Fashion: botões lado a lado, com favoritar como ícone à parte —
     mais "app de compra"; Premium/Minimalist mantêm empilhado (referência). */
  [data-store-model="classic"] .action-row, [data-store-model="ecommerce"] .action-row{flex-direction:row; flex-wrap:wrap;}
  [data-store-model="classic"] .action-row .btn-buy, [data-store-model="ecommerce"] .action-row .btn-buy,
  [data-store-model="classic"] .action-row .btn-add, [data-store-model="ecommerce"] .action-row .btn-add{flex:1 1 45%;}
  [data-store-model="classic"] .action-row .btn-fav, [data-store-model="ecommerce"] .action-row .btn-fav{flex:1 1 100%;}
  .btn-add{padding:16px; border:1.5px solid var(--accent); border-radius:var(--tpl-radius-sm); background:transparent; color:var(--accent); font-family:var(--font-body); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; transition:background .2s ease, color .2s ease;}
  .btn-add:hover{background:var(--accent); color:var(--on-accent);}
  .btn-buy{padding:16px; border:none; border-radius:var(--tpl-radius-sm); background:var(--accent); color:var(--on-accent); font-family:var(--font-body); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; transition:filter .2s ease;}
  .btn-buy:hover{filter:brightness(1.08);}
  .btn-fav{display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border:1.5px solid var(--line); border-radius:var(--tpl-radius-sm); background:transparent; color:var(--ink-soft); font-family:var(--font-body); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; transition:border-color .2s ease, color .2s ease;}
  .btn-fav:hover{border-color:var(--accent); color:var(--accent);}
  .btn-fav.active{border-color:var(--accent); color:var(--accent);}
  .btn-fav svg{flex-shrink:0;}

  .trust-mini{display:flex; flex-direction:column; gap:10px; font-size:12.5px; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:20px;}
  .trust-mini span{display:flex; align-items:center; gap:8px;}

  .tabs-section{max-width:1160px; margin:0 auto; padding:0 20px 60px;}
  .tabs-nav{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:24px; overflow-x:auto;}
  .tab-btn{padding:12px 18px; border:none; background:none; font-family:var(--font-body); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); border-bottom:2px solid transparent; white-space:nowrap; margin-bottom:-1px; transition:color .2s ease;}
  .tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}
  .tab-panel{display:none; max-width:720px;}
  .tab-panel.active{display:block;}
  .tab-panel p{font-size:14.5px; line-height:1.75; color:var(--ink-soft);}
  .size-table{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:10px;}
  .size-table th, .size-table td{padding:10px 12px; border:1px solid var(--line); text-align:center; color:var(--ink);}
  .size-table th{background:var(--card); font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:.04em; color:var(--ink-soft);}

  .review-card{border-bottom:1px solid var(--line); padding:18px 0;}
  .review-card:first-child{padding-top:0;}
  .review-stars{color:var(--accent); font-size:13px; margin-bottom:8px; letter-spacing:1px;}
  .review-name{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-top:8px;}
  .review-empty{font-size:13.5px; color:var(--ink-soft);}

  .related-section{max-width:1160px; margin:0 auto; padding:0 20px 60px;}
  .related-section h2{font-family:var(--font-heading); font-weight:400; font-size:22px; margin:0 0 20px; color:var(--ink);}
  .related-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
  @media (min-width:640px){ .related-grid{grid-template-columns:repeat(4,1fr);} }
  .related-card{background:var(--card); border:1px solid var(--line); border-radius:var(--tpl-radius); overflow:hidden; text-align:left; width:100%; transition:border-color .25s ease, transform .25s ease;}
  .related-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .related-thumb{width:100%; aspect-ratio:1/1; object-fit:cover; background:color-mix(in srgb, var(--card) 60%, var(--bg) 40%); display:block;}
  .related-info{padding:12px;}
  .related-info h3{font-size:12px; margin:0 0 4px; font-weight:600; text-transform:uppercase; letter-spacing:.02em; line-height:1.3; color:var(--ink);}
  .related-info p{font-size:12.5px; color:var(--accent); margin:0;}

  footer{border-top:1px solid var(--line); background:var(--card);}
  .footer-inner{display:flex; flex-direction:column; gap:8px; padding:32px 20px; font-size:13px; color:var(--ink-soft);}
  @media (min-width:640px){ .footer-inner{flex-direction:row; justify-content:space-between; align-items:center;} }
  .footer-links a{color:var(--ink-soft); transition:color .2s ease;}
  .footer-links a:hover{color:var(--accent);}

  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:12px 20px; border-radius:0; font-size:13.5px; display:none; z-index:60; box-shadow:0 12px 30px rgba(0,0,0,0.35);
  }
  #toast.show{display:block;}

  .loading-msg, .notfound-msg{max-width:1160px; margin:0 auto; padding:80px 20px; text-align:center; color:var(--ink-soft); font-size:14px;}

  @keyframes skeleton-pulse{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
  .skel-layout{display:grid; grid-template-columns:1fr; gap:36px; padding:20px 20px 50px; max-width:1160px; margin:0 auto;}
  @media (min-width:900px){ .skel-layout{grid-template-columns:1.1fr 1fr;} }
  .skel-img{width:100%; aspect-ratio:1/1; background:var(--line); animation:skeleton-pulse 1.4s ease-in-out infinite;}
  .skel-line{height:14px; border-radius:2px; background:var(--line); animation:skeleton-pulse 1.4s ease-in-out infinite; margin-bottom:12px;}
</style>
</head>
<body>

<header>
  <div class="container">
    <a href="index.html" class="brand serif">
      <span id="logoImgProduto" class="logo-mark" style="width:28px;height:28px;">
        <svg width="100%" height="100%" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#fff"/><text x="20" y="27" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="17" fill="#111">JA</text></svg>
      </span>
      <span id="brandTextProduto">JA STORE</span>
    </a>
    <div class="right">
      <a href="index.html" class="back-link">← Voltar à loja</a>
      <button class="icon-btn" id="openCartBtn" aria-label="Carrinho">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 2L4 6M18 2l2 4M3 8h18l-1.5 12a2 2 0 01-2 1.8H6.5a2 2 0 01-2-1.8L3 8z" stroke="currentColor" stroke-width="1.8"/></svg>
        <span class="cart-count" id="cartCount" style="display:none">0</span>
      </button>
    </div>
  </div>
</header>

<nav class="breadcrumb" id="breadcrumb"></nav>

<div id="productRoot">
  <div class="skel-layout">
    <div class="skel-img"></div>
    <div>
      <div class="skel-line" style="width:40%;"></div>
      <div class="skel-line" style="width:80%; height:22px;"></div>
      <div class="skel-line" style="width:30%; height:22px;"></div>
      <div class="skel-line" style="width:60%;"></div>
      <div class="skel-line" style="width:90%;"></div>
    </div>
  </div>
</div>

<section class="related-section" id="relatedSection" style="display:none;">
  <h2 class="serif">Você também pode gostar</h2>
  <div class="related-grid" id="relatedGrid"></div>
</section>

<footer>
  <div class="container footer-inner">
    <span>© 2026 JA Store</span>
    <span class="footer-links"><a href="troca-e-devolucao.html">Troca e Devolução</a></span>
    <span>Preços de venda rápida — ajuste no catálogo sempre que o custo do fornecedor mudar.</span>
  </div>
</footer>

<div id="toast"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/tracking.js"></script>
<script>
(function(){
  const sb = window.getSupabaseClient();
  const params = new URLSearchParams(window.location.search);
  const slugParam = params.get('slug');
  const idParam = params.get('id');

  const SWATCHES = ["#111111", "#3D3D3D", "#6E6E73", "#A3A3A3", "#D4D4D4"];
  const SIZE_SETS = { clothing: ['PP','P','M','G','GG'], shoe: ['38','39','40','41','42','43'], none: ['Único'] };
  let FREE_SHIPPING_THRESHOLD = 300; // padrão de segurança — substituído pelo valor real do admin

  // Mesmos 4 modelos completos da Home (index.html) — replicados aqui
  // porque esta é uma página HTML separada, sem módulo JS compartilhado.
  // Só os tokens de cor/tipografia/formato; a estrutura da página de
  // produto (galeria + info + abas) é a mesma nos 4, já que o ZIP do
  // Stitch não trouxe uma tela própria de produto pra cada modelo.
  const TEMPLATE_DESIGN_TOKENS = {
    classic: { bg:'#131313', card:'#1E1E1E', ink:'#F5F3F2', inkSoft:'#8E8E93', line:'#2A2A2A', accent:'#FF5168', radius:'4px', radiusSm:'2px', fontHeading:"'Montserrat', sans-serif", fontHeadingImport:'Montserrat:wght@700;800', fontBody:"'Be Vietnam Pro', sans-serif", fontBodyImport:'Be+Vietnam+Pro:wght@400;500;700' },
    premium: { bg:'#131313', card:'#1A1A1A', ink:'#E5E2E1', inkSoft:'#D0C5AF', line:'#333333', accent:'#F2CA50', radius:'0px', radiusSm:'0px', fontHeading:"'Libre Caslon Text', serif", fontHeadingImport:'Libre+Caslon+Text', fontBody:"'Manrope', sans-serif", fontBodyImport:'Manrope:wght@400;500;600' },
    ecommerce: { bg:'#F8FAFC', card:'#FFFFFF', ink:'#191C1E', inkSoft:'#464554', line:'#E2E8F0', accent:'#4648D4', radius:'16px', radiusSm:'8px', fontHeading:"'Hanken Grotesk', sans-serif", fontHeadingImport:'Hanken+Grotesk:wght@700;800', fontBody:"'Plus Jakarta Sans', sans-serif", fontBodyImport:'Plus+Jakarta+Sans:wght@400;500;600' },
    minimal: { bg:'#F9F9F9', card:'#FFFFFF', ink:'#1A1C1C', inkSoft:'#757575', line:'#F0F0F0', accent:'#111111', radius:'0px', radiusSm:'0px', fontHeading:"'Manrope', sans-serif", fontHeadingImport:'Manrope:wght@600;700', fontBody:"'Inter', sans-serif", fontBodyImport:'Inter:wght@400;500' },
  };
  const loadedGoogleFonts = new Set();
  function ensureGoogleFontLoaded(importName){
    if (!importName || loadedGoogleFonts.has(importName)) return;
    loadedGoogleFonts.add(importName);
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `https://fonts.googleapis.com/css2?family=${importName}&display=swap`;
    document.head.appendChild(link);
  }
  function hexLuminance(hex){
    const h = (hex||'#000000').replace('#','');
    const r = parseInt(h.substr(0,2),16)||0, g = parseInt(h.substr(2,2),16)||0, b = parseInt(h.substr(4,2),16)||0;
    return 0.299*r + 0.587*g + 0.114*b;
  }
  function applyStoreModel(key){
    const tokens = TEMPLATE_DESIGN_TOKENS[key] || TEMPLATE_DESIGN_TOKENS.premium;
    const root = document.documentElement.style;
    root.setProperty('--bg', tokens.bg);
    root.setProperty('--card', tokens.card);
    root.setProperty('--ink', tokens.ink);
    root.setProperty('--ink-soft', tokens.inkSoft);
    root.setProperty('--line', tokens.line);
    root.setProperty('--accent', tokens.accent);
    root.setProperty('--rust', tokens.accent);
    root.setProperty('--on-accent', hexLuminance(tokens.accent) > 150 ? '#241A00' : '#FFFFFF');
    root.setProperty('--tpl-radius', tokens.radius);
    root.setProperty('--tpl-radius-sm', tokens.radiusSm);
    root.setProperty('--font-heading', tokens.fontHeading);
    root.setProperty('--font-body', tokens.fontBody);
    // O cabeçalho utilitário desta página (logo + voltar + carrinho) é
    // sempre escuro nos modelos de fundo escuro (Fashion/Premium) e claro
    // nos de fundo claro (Modern/Minimalist) — sem isso, ficaria uma barra
    // preta destoando em cima de um modelo branco.
    const headerIsDark = hexLuminance(tokens.bg) < 128;
    root.setProperty('--header-bg', headerIsDark ? '#0B0B0C' : tokens.card);
    root.setProperty('--header-ink', headerIsDark ? '#FFFFFF' : tokens.ink);
    root.setProperty('--header-icon-bg', headerIsDark ? 'rgba(255,255,255,0.12)' : 'color-mix(in srgb, ' + tokens.ink + ' 10%, transparent)');
    document.documentElement.setAttribute('data-store-model', TEMPLATE_DESIGN_TOKENS[key] ? key : 'premium');
    ensureGoogleFontLoaded(tokens.fontHeadingImport);
    ensureGoogleFontLoaded(tokens.fontBodyImport);
  }

  async function loadFreeShippingConfig(){
    try {
      const { data } = await sb.from('store_settings').select('free_shipping_threshold, logo_url, store_name, header_template').eq('id', 1).maybeSingle();
      applyStoreModel(data && data.header_template);
      if (data && data.free_shipping_threshold != null){
        FREE_SHIPPING_THRESHOLD = Number(data.free_shipping_threshold);
      }
      // Mesma logo/nome cadastrados em Personalização → Loja Online — não
      // existe uma logo separada só pra essa página, pra nunca ter duas
      // marcas diferentes do mesmo negócio.
      if (data && data.store_name){
        const brandEl = document.getElementById('brandTextProduto');
        if (brandEl) brandEl.textContent = data.store_name.toUpperCase();
      }
      if (data && data.logo_url){
        const logoEl = document.getElementById('logoImgProduto');
        if (logoEl) logoEl.innerHTML = `<img src="${data.logo_url}" alt="" onerror="this.parentElement.innerHTML='JA';">`;
      }
    } catch (err) {
      console.error('Não foi possível carregar configuração de frete grátis:', err);
      applyStoreModel(null);
    }
  }

  let cart = window.CartStore.load();
  let wishlist = JSON.parse(localStorage.getItem('ja_wishlist') || '[]');
  let product = null;
  let allProducts = [];
  let selectedSize = null;
  let qty = 1;
  let galleryImages = [];

  function formatBRL(v){ return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function effectivePrice(p){ return (p.sale_price && Number(p.sale_price) > 0 && Number(p.sale_price) < Number(p.price)) ? Number(p.sale_price) : Number(p.price); }
  function isOnSale(p){ return p.sale_price && Number(p.sale_price) > 0 && Number(p.sale_price) < Number(p.price); }

  function updateCartCount(){
    const el = document.getElementById('cartCount');
    const count = window.CartStore.count(cart);
    if (count > 0){ el.style.display = 'flex'; el.textContent = count; }
    else { el.style.display = 'none'; }
  }
  updateCartCount();

  document.getElementById('openCartBtn').addEventListener('click', ()=>{
    window.location.href = 'index.html#produtos';
  });

  let toastTimer;
  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 2400);
  }

  function persistCart(){
    window.CartStore.save(cart);
    updateCartCount();
  }

  async function init(){
    try {
      window.JATracking.init();
      await loadFreeShippingConfig();

      let query = sb.from('products').select('*').eq('active', true);
      if (slugParam) query = query.eq('slug', slugParam);
      else if (idParam) query = query.eq('id', idParam);
      else { renderNotFound(); return; }

      const { data, error } = await query.maybeSingle();
      if (error) throw error;
      if (!data){ renderNotFound(); return; }

      product = data;
      selectedSize = (SIZE_SETS[product.size_type] || SIZE_SETS.clothing)[0];

      // Busca o nome "bonito" da categoria (ex: "Camisetas") pra mostrar
      // no lugar do slug cru salvo no produto (ex: "camisetas").
      let categoryLabel = product.category;
      try {
        const { data: catData } = await sb.from('categories').select('name').eq('slug', product.category).maybeSingle();
        if (catData?.name) categoryLabel = catData.name;
      } catch (err) { /* mantém o slug como reserva, sem quebrar a página */ }
      product.categoryLabel = categoryLabel;

      document.getElementById('pageTitle').textContent = `${product.name} | JA Store`;
      document.getElementById('pageDescription').setAttribute('content', (product.description || product.name).slice(0,155));

      document.getElementById('breadcrumb').innerHTML = `<a href="index.html">Início</a> / <a href="index.html">${categoryLabel}</a> / <span style="color:var(--ink);">${product.name}</span>`;

      renderProduct();
      window.JATracking.trackViewItem({ id: product.id, name: product.name, price: effectivePrice(product) });
      loadReviews();
      loadRelated();

      const { data: allData } = await sb.from('products').select('*').eq('active', true);
      allProducts = allData || [];
    } catch (err) {
      console.error(err);
      renderNotFound();
    }
  }

  function renderNotFound(){
    document.getElementById('productRoot').innerHTML = `
      <div class="notfound-msg">
        <p>Não encontramos esse produto — ele pode ter sido removido ou o link está incorreto.</p>
        <a href="index.html" style="color:var(--ink); font-weight:700;">← Voltar à loja</a>
      </div>
    `;
  }

  function placeholderSVG(tone){
    const color = SWATCHES[tone % SWATCHES.length];
    return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${color}0F;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none"><path d="M8 3L3 7l2 3 2-1v11h10V9l2 1 2-3-5-4-1.5 1.5a2.5 2.5 0 01-3 0L8 3z" stroke="${color}" stroke-width="1.2"/></svg>
    </div>`;
  }

  function renderProduct(){
    galleryImages = [product.image_url, ...(product.images||[])].filter(Boolean);
    const onSale = isOnSale(product);
    const soldOut = product.stock <= 0;
    const isFav = wishlist.includes(product.id);
    const sizeType = product.size_type || 'clothing';
    const sizes = SIZE_SETS[sizeType] || SIZE_SETS.clothing;

    document.getElementById('productRoot').innerHTML = `
      <div class="product-layout">
        <div class="gallery">
          <div class="gallery-main" id="galleryMain"></div>
          <div class="gallery-thumbs" id="galleryThumbs"></div>
        </div>
        <div class="product-info">
          <p class="eyebrow">${product.categoryLabel || product.category}</p>
          <h1 class="serif">${product.name}</h1>
          <div class="rating-summary" id="productRatingSummary"></div>
          <div class="price-row">
            ${onSale ? `<span class="price-old">${formatBRL(product.price)}</span>` : ''}
            <span class="price-now ${onSale?'on-sale':''}">${soldOut ? 'Indisponível' : formatBRL(effectivePrice(product))}</span>
            ${onSale ? `<span class="price-badge" id="priceBadge">-${Math.round((1-Number(product.sale_price)/Number(product.price))*100)}%</span>` : ''}
          </div>
          <p class="price-notes">Em até <b>12x</b> no cartão · <b>5% de desconto</b> pagando no Pix no checkout</p>

          <span class="stock-badge" style="color:${soldOut?'var(--rust)':'var(--green)'};">
            <span class="stock-dot" style="background:${soldOut?'var(--rust)':'var(--green)'};"></span>
            ${soldOut ? 'Esgotado' : (product.stock <= 5 ? `Últimas ${product.stock} unidades` : 'Em estoque')}
          </span>

          ${sizeType !== 'none' ? `
            <label class="opt-label">${sizeType === 'shoe' ? 'Numeração' : 'Tamanho'}</label>
            <div class="size-row" id="sizeRow">
              ${sizes.map(s => `<button class="size-btn ${s===selectedSize?'active':''}" data-size="${s}">${s}</button>`).join('')}
            </div>
          ` : ''}

          <label class="opt-label">Quantidade</label>
          <div class="qty-row">
            <button class="qty-btn" id="qtyDec">−</button>
            <span class="qty-value" id="qtyValue">1</span>
            <button class="qty-btn" id="qtyInc">+</button>
          </div>

          <div class="action-row">
            <button class="btn-buy" id="buyNowBtn" ${soldOut?'disabled style="opacity:.5;"':''}>Comprar agora</button>
            <button class="btn-add" id="addToCartBtn" ${soldOut?'disabled style="opacity:.5;"':''}>Adicionar à sacola</button>
            <button class="btn-fav ${isFav?'active':''}" id="favBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="${isFav?'currentColor':'none'}"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z" stroke="currentColor" stroke-width="1.8"/></svg>
              ${isFav ? 'Nos favoritos' : 'Favoritar'}
            </button>
          </div>

          <div class="trust-mini">
            <span>🚚 Frete grátis acima de ${formatBRL(FREE_SHIPPING_THRESHOLD)}</span>
            <span>🛵 Entrega por motoboy disponível para regiões próximas (calculado no checkout)</span>
            <span>🔒 Compra 100% segura via Mercado Pago</span>
          </div>
        </div>
      </div>

      <section class="tabs-section">
        <div class="tabs-nav" id="tabsNav">
          <button class="tab-btn active" data-tab="descricao">Descrição</button>
          <button class="tab-btn" data-tab="medidas">Tabela de medidas</button>
          <button class="tab-btn" data-tab="entrega">Entrega</button>
          <button class="tab-btn" data-tab="troca">Troca e devolução</button>
          <button class="tab-btn" data-tab="avaliacoes">Avaliações</button>
        </div>

        <div class="tab-panel active" data-panel="descricao">
          <p>${product.description ? product.description.replace(/\n/g,'<br>') : 'Sem descrição cadastrada para este produto.'}</p>
        </div>

        <div class="tab-panel" data-panel="medidas">
          ${sizeType === 'shoe' ? `
            <table class="size-table">
              <thead><tr><th>BR</th><th>CM</th></tr></thead>
              <tbody>
                <tr><td>38</td><td>24,5</td></tr><tr><td>39</td><td>25,0</td></tr><tr><td>40</td><td>25,7</td></tr>
                <tr><td>41</td><td>26,5</td></tr><tr><td>42</td><td>27,2</td></tr><tr><td>43</td><td>28,0</td></tr>
              </tbody>
            </table>
          ` : sizeType === 'clothing' ? `
            <table class="size-table">
              <thead><tr><th>Tam.</th><th>Tórax (cm)</th><th>Comprimento (cm)</th></tr></thead>
              <tbody>
                <tr><td>PP</td><td>88–92</td><td>66</td></tr>
                <tr><td>P</td><td>92–96</td><td>68</td></tr>
                <tr><td>M</td><td>96–102</td><td>70</td></tr>
                <tr><td>G</td><td>102–108</td><td>72</td></tr>
                <tr><td>GG</td><td>108–114</td><td>74</td></tr>
              </tbody>
            </table>
          ` : `<p>Este produto tem tamanho único.</p>`}
          <p style="margin-top:12px; font-size:12.5px;">Medidas de referência — pode haver pequena variação entre peças.</p>
        </div>

        <div class="tab-panel" data-panel="entrega">
          <p>Calculamos o frete (Correios, transportadora ou motoboy) direto no checkout, a partir do seu CEP.</p>
          <p>Frete grátis em compras acima de ${formatBRL(FREE_SHIPPING_THRESHOLD)}.</p>
        </div>

        <div class="tab-panel" data-panel="troca">
          <p>Trocas e devoluções em até 7 dias corridos após o recebimento, com o produto sem uso e com etiqueta.</p>
          <a href="troca-e-devolucao.html" style="color:var(--ink); font-weight:700; text-decoration:underline;">Ver a política completa →</a>
        </div>

        <div class="tab-panel" data-panel="avaliacoes">
          <div id="reviewsList"><p class="review-empty">Carregando avaliações...</p></div>
        </div>
      </section>
    `;

    renderGallery();
    bindProductEvents();
  }

  function renderGallery(){
    const mainEl = document.getElementById('galleryMain');
    const thumbsEl = document.getElementById('galleryThumbs');

    function setMain(url){
      mainEl.innerHTML = url ? `<img src="${url}" alt="${product.name}" onerror="this.parentElement.innerHTML=window.__phSVG;">` : placeholderSVG(product.tone||0);
    }
    window.__phSVG = placeholderSVG(product.tone||0);

    setMain(galleryImages[0]);

    if (galleryImages.length > 1){
      thumbsEl.innerHTML = galleryImages.map((url,i) => `
        <div class="gallery-thumb ${i===0?'active':''}" data-thumb="${i}"><img src="${url}" loading="lazy" onerror="this.style.display='none'"></div>
      `).join('');
      thumbsEl.querySelectorAll('.gallery-thumb').forEach(t=>{
        t.addEventListener('click', ()=>{
          thumbsEl.querySelectorAll('.gallery-thumb').forEach(x=>x.classList.remove('active'));
          t.classList.add('active');
          setMain(galleryImages[Number(t.dataset.thumb)]);
        });
      });
    }
  }

  function bindProductEvents(){
    document.querySelectorAll('#sizeRow .size-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#sizeRow .size-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        selectedSize = btn.dataset.size;
      });
    });

    document.getElementById('qtyDec').addEventListener('click', ()=>{
      qty = Math.max(1, qty-1);
      document.getElementById('qtyValue').textContent = qty;
    });
    document.getElementById('qtyInc').addEventListener('click', ()=>{
      qty = Math.min(product.stock || 99, qty+1);
      document.getElementById('qtyValue').textContent = qty;
    });

    document.getElementById('addToCartBtn').addEventListener('click', ()=> addToCart(false));
    document.getElementById('buyNowBtn').addEventListener('click', ()=> addToCart(true));

    document.getElementById('favBtn').addEventListener('click', ()=>{
      const idx = wishlist.indexOf(product.id);
      if (idx>=0) wishlist.splice(idx,1); else wishlist.push(product.id);
      localStorage.setItem('ja_wishlist', JSON.stringify(wishlist));
      renderProduct();
    });

    document.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        document.querySelector(`.tab-panel[data-panel="${btn.dataset.tab}"]`).classList.add('active');
      });
    });
  }

  function addToCart(buyNow){
    const idx = cart.findIndex(i=>i.id===product.id && i.size===selectedSize);
    const currentQty = idx>=0 ? cart[idx].qty : 0;
    if (currentQty + qty > product.stock){
      showToast('Sem estoque suficiente');
      return;
    }
    if (idx>=0){ cart[idx].qty += qty; }
    else { cart.push({ id:product.id, size:selectedSize, qty, name:product.name, price:effectivePrice(product), image:product.image_url }); }
    persistCart();
    window.JATracking.trackAddToCart({ id: product.id, name: product.name, price: effectivePrice(product) }, qty);

    if (buyNow){
      window.location.href = 'checkout.html';
    } else {
      showToast(`${product.name} adicionado à sacola`);
    }
  }

  async function loadReviews(){
    try {
      const { data, error } = await sb.from('product_reviews').select('*').eq('product_id', product.id).eq('active', true).order('created_at', { ascending:false });
      if (error) throw error;
      const el = document.getElementById('reviewsList');
      if (el){
        el.innerHTML = (data && data.length)
          ? data.map(r => `
            <div class="review-card">
              <div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
              <p style="font-size:14px; margin:0; color:var(--ink-soft);">${r.comment || ''}</p>
              <p class="review-name">${r.customer_name}</p>
            </div>
          `).join('')
          : `<p class="review-empty">Ainda não há avaliações para este produto.</p>`;
      }

      // Resumo de nota (estrelas ao lado do título) — só com dado real:
      // produto sem avaliação nenhuma não mostra o bloco (não inventa nota).
      const summaryEl = document.getElementById('productRatingSummary');
      if (summaryEl){
        if (data && data.length){
          const avg = data.reduce((s,r)=>s+r.rating,0) / data.length;
          const full = Math.round(avg);
          summaryEl.innerHTML = `${'★'.repeat(full)}<span style="color:var(--line);">${'★'.repeat(5-full)}</span><span class="rs-count">(${data.length} avaliaç${data.length===1?'ão':'ões'})</span>`;
        } else {
          summaryEl.innerHTML = '';
        }
      }
    } catch (err) {
      console.error(err);
    }
  }

  async function loadRelated(){
    try {
      const { data, error } = await sb.from('products').select('*').eq('active', true).eq('category', product.category).neq('id', product.id).limit(4);
      if (error) throw error;
      if (!data || !data.length) return;
      document.getElementById('relatedSection').style.display = 'block';
      document.getElementById('relatedGrid').innerHTML = data.map(p => `
        <a class="related-card" href="produto.html?slug=${encodeURIComponent(p.slug||p.id)}">
          <img class="related-thumb" src="${p.image_url||''}" loading="lazy" onerror="this.style.background='var(--bg)';this.src='';">
          <div class="related-info">
            <h3>${p.name}</h3>
            <p>${formatBRL(effectivePrice(p))}</p>
          </div>
        </a>
      `).join('');
    } catch (err) {
      console.error(err);
    }
  }

  init();
})();
</script>

</body>
</html>

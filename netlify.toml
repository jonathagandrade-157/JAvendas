[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# As funções ficam acessíveis em /.netlify/functions/<nome>
# Redirects amigáveis (opcional, deixa as URLs mais curtas)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
